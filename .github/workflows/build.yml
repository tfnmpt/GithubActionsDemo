name: Build ASP.NET Core Web App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 5
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '5.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build

      - name: Publish
        run: dotnet publish -c Release -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aspnet-core-app
          path: ./publish

      - name: Deploy to IIS
        shell: powershell
        run: |
          $target = "C:\inetpub\GithubActionsDemo"

          New-Item -Path "$target\app_offline.htm" -ItemType File -Force | Out-Null

          Start-Sleep -Seconds 2

          robocopy ".\publish" "$target" /E /R:2 /W:2

          if ($LASTEXITCODE -ge 8) {
              exit $LASTEXITCODE
          }

          Remove-Item "$target\app_offline.htm" -Force