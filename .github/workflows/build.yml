name: Build ASP.NET Core Web App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 5
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '5.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build

      - name: Publish
        run: dotnet publish -c Release -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aspnet-core-app
          path: ./publish

        - name: Deploy to IIS
            shell: powershell
            run: |
              Import-Module WebAdministration

              $appPool = "GithubActionsDemo"
              $target = "C:\inetpub\GithubActionsDemo"

              Write-Host "Stopping IIS Application Pool..."
              Stop-WebAppPool -Name $appPool

              Start-Sleep -Seconds 3

              Write-Host "Copying published files..."
              robocopy ".\publish" "$target" /E /R:2 /W:2

              $robocopyExitCode = $LASTEXITCODE

              if ($robocopyExitCode -ge 8) {
                  Write-Error "Robocopy failed with exit code $robocopyExitCode"
                  Start-WebAppPool -Name $appPool
                  exit $robocopyExitCode
              }

              Write-Host "Robocopy completed with exit code $robocopyExitCode"

              Write-Host "Starting IIS Application Pool..."
              Start-WebAppPool -Name $appPool

              Start-Sleep -Seconds 3

              Write-Host "Deployment completed successfully."

              exit 0